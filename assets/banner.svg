<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Leitor de XML: abre XML com folha de estilo no Edge e no Chrome">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b3a63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#fundo)"/>

  <!-- documento XML cru -->
  <g transform="translate(70 70)">
    <path d="M0 0 h96 l28 28 v132 h-124 z" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <path d="M96 0 v28 h28" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="62" y="62" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#fbbf24">&lt;/&gt;</text>
    <g fill="#475569">
      <rect x="16" y="84" width="80" height="7" rx="3"/>
      <rect x="16" y="100" width="92" height="7" rx="3"/>
      <rect x="16" y="116" width="64" height="7" rx="3"/>
      <rect x="16" y="132" width="86" height="7" rx="3"/>
    </g>
  </g>

  <!-- seta -->
  <g fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 150 h44"/>
    <path d="M246 136 l14 14 l-14 14"/>
  </g>

  <!-- documento formatado -->
  <g transform="translate(276 70)">
    <path d="M0 0 h96 l28 28 v132 h-124 z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M96 0 v28 h28" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="14" y="40" width="96" height="16" rx="3" fill="#0056b3"/>
    <rect x="14" y="66" width="44" height="30" rx="3" fill="#e9ecef" stroke="#94a3b8"/>
    <rect x="66" y="66" width="44" height="30" rx="3" fill="#e9ecef" stroke="#94a3b8"/>
    <rect x="14" y="104" width="44" height="30" rx="3" fill="#e9ecef" stroke="#94a3b8"/>
    <rect x="66" y="104" width="44" height="30" rx="3" fill="#e9ecef" stroke="#94a3b8"/>
  </g>

  <!-- textos -->
  <text x="450" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc">Leitor de XML</text>
  <text x="452" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">XML com XSL formatado no Edge e no Chrome.</text>

  <!-- etiquetas -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="452" y="206" width="190" height="36" rx="18" fill="#334155"/>
    <text x="547" y="230" text-anchor="middle" fill="#e2e8f0">Sem Modo IE</text>
    <rect x="654" y="206" width="160" height="36" rx="18" fill="#334155"/>
    <text x="734" y="230" text-anchor="middle" fill="#e2e8f0">Só local</text>
    <rect x="826" y="206" width="170" height="36" rx="18" fill="#334155"/>
    <text x="911" y="230" text-anchor="middle" fill="#e2e8f0">Python + Flask</text>
  </g>
</svg>
